name: Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy: Pages serves whatever finished last, so a
# cancelled run can leave the site on an older build than main.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build-storybook
      - uses: actions/configure-pages@v6
      # Storybook emits relative asset paths, so the build needs no base-path
      # configuration to serve from the /sankara-ui/ project-page subpath.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static
      - id: deploy
        uses: actions/deploy-pages@v5
