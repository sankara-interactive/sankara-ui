name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: yarn
      - run: yarn install --immutable
      - run: yarn check

  packaging-smoke:
    name: Packaging smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: yarn
      - run: yarn install --immutable
      # yarn pack runs the "prepack" script (yarn build), so this also
      # verifies dist exists and is up to date before it's packed.
      - run: yarn pack -o ${{ runner.temp }}/sankara-ui.tgz
      # Deliberately without the FontAwesome peers: the main entry point must
      # import cleanly in a project that never renders an Icon.
      - name: Install the tarball into a clean project
        working-directory: ${{ runner.temp }}
        run: |
          mkdir packaging-smoke && cd packaging-smoke
          npm init -y >/dev/null
          npm install ../sankara-ui.tgz react react-dom
      - name: Verify the entry points resolve without FontAwesome
        working-directory: ${{ runner.temp }}/packaging-smoke
        run: |
          node -e "import('@sankara-ui/core').then(m => { if (typeof m.Carousel !== 'function') throw new Error('Carousel export missing'); console.log('index entry point OK'); })"
          node --input-type=module -e "
            import fs from 'node:fs';
            import { fileURLToPath } from 'node:url';
            const path = fileURLToPath(import.meta.resolve('@sankara-ui/core/styles.css'));
            if (!fs.existsSync(path)) throw new Error('styles.css export path does not exist: ' + path);
            console.log('styles.css entry point OK:', path);
          "
      - name: Verify the icon entry point resolves once FontAwesome is installed
        working-directory: ${{ runner.temp }}/packaging-smoke
        run: |
          npm install @fortawesome/fontawesome-svg-core @fortawesome/react-fontawesome
          node -e "import('@sankara-ui/core/icon').then(m => { if (typeof m.Icon !== 'function') throw new Error('Icon export missing'); console.log('icon entry point OK'); })"
